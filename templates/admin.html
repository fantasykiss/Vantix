<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantix Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0f1117;
  --surface:      #181c27;
  --surface2:     #1e2333;
  --border:       rgba(255,255,255,.08);
  --border-light: rgba(255,255,255,.05);
  --text:         #e8eaf2;
  --text-muted:   #6b7280;
  --text-dim:     #9ca3af;
  --accent:       #4f8ef7;
  --accent-dim:   rgba(79,142,247,.15);
  --green:        #4caf7d;
  --yellow:       #f0b429;
  --red:          #e05252;
  --radius:       8px;
}

body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

/* ── Login screen ── */
#login-screen {
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
}
.login-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 40px 36px; width: 360px; max-width: 90vw;
}
.login-logo { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 24px; }
.login-logo span { color: var(--accent); }
.login-box h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.login-box input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-size: 14px; outline: none; margin-bottom: 12px;
}
.login-box input:focus { border-color: var(--accent); }
.login-box button {
  width: 100%; padding: 11px; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
}
.login-box button:hover { opacity: .85; }
.login-err { font-size: 12px; color: var(--red); margin-top: 8px; min-height: 16px; text-align: center; }

/* ── App layout ── */
#app { display: none; }
.topbar {
  height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px; gap: 16px; position: sticky; top: 0; z-index: 100;
}
.topbar-logo { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--text-muted); text-transform: uppercase; }
.topbar-logo span { color: var(--accent); }
.topbar-sep { width: 1px; height: 16px; background: var(--border); }
.topbar-title { font-size: 14px; font-weight: 600; }
.topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.topbar-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--accent-dim); color: var(--accent); font-weight: 600; }

.tabs {
  display: flex; gap: 2px; padding: 16px 24px 0; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.tab-btn {
  padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: pointer;
  background: none; border: none; color: var(--text-muted); border-bottom: 2px solid transparent;
  transition: color .15s; margin-bottom: -1px;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-btn:hover { color: var(--text-dim); }

.main { padding: 24px; max-width: 1100px; }

/* ── Cards ── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px;
}
.card-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.card-value { font-size: 28px; font-weight: 700; color: var(--text); }
.card-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* ── Section ── */
.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
.section-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted);
  display: flex; align-items: center; justify-content: space-between;
}
.section-body { padding: 0; }

/* ── Table ── */
table { width: 100%; border-collapse: collapse; }
th {
  padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em;
  border-bottom: 1px solid var(--border);
}
td { padding: 11px 16px; font-size: 13px; border-bottom: 1px solid var(--border-light); color: var(--text-dim); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.02); color: var(--text); }

/* ── Bar chart ── */
.bar-row { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--border-light); }
.bar-row:last-child { border-bottom: none; }
.bar-label { width: 160px; font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s; }
.bar-fill.green { background: var(--green); }
.bar-fill.yellow { background: var(--yellow); }
.bar-val { font-size: 12px; color: var(--text-muted); width: 48px; text-align: right; flex-shrink: 0; }

/* ── Feedback items ── */
.fb-item { padding: 16px 18px; border-bottom: 1px solid var(--border-light); }
.fb-item:last-child { border-bottom: none; }
.fb-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.fb-badge {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: .05em;
}
.fb-badge.inquiry { background: var(--accent-dim); color: var(--accent); }
.fb-badge.suggestion { background: rgba(76,175,125,.15); color: var(--green); }
.fb-meta { font-size: 11px; color: var(--text-muted); }
.fb-message { font-size: 13px; color: var(--text); line-height: 1.5; }
.fb-sender { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* ── Daily chart ── */
.daily-chart { display: flex; align-items: flex-end; gap: 6px; padding: 16px 18px; height: 100px; }
.daily-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.daily-bar { width: 100%; border-radius: 3px 3px 0 0; background: var(--accent); opacity: .7; min-height: 2px; transition: height .4s; }
.daily-bar:hover { opacity: 1; }
.daily-label { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

.empty { padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .main { padding: 16px; }
  .cards { grid-template-columns: 1fr 1fr; }
  .topbar { padding: 0 16px; }
  .tabs { padding: 12px 16px 0; }
}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><span>Vantix</span> Admin</div>
    <h2>관리자 로그인</h2>
    <input id="pw-input" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()" autofocus />
    <button onclick="doLogin()">로그인</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><span>Vantix</span></div>
    <div class="topbar-sep"></div>
    <div class="topbar-title">Admin</div>
    <div class="topbar-right">
      <div class="topbar-badge" id="badge-sessions">— 세션</div>
      <div class="topbar-badge" id="badge-feedback" style="background:rgba(76,175,125,.15);color:#4caf7d;">— 문의</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('analytics',this)">Analytics</button>
    <button class="tab-btn" onclick="switchTab('feedback',this)">문의 · 건의</button>
  </div>

  <!-- Analytics Tab -->
  <div class="main" id="tab-analytics">

    <div class="cards" id="stat-cards">
      <div class="card">
        <div class="card-label">총 세션</div>
        <div class="card-value" id="stat-sessions">—</div>
      </div>
      <div class="card">
        <div class="card-label">가장 오래 머문 페이지</div>
        <div class="card-value" id="stat-top-page" style="font-size:18px;margin-top:4px;">—</div>
        <div class="card-sub" id="stat-top-page-sec"></div>
      </div>
      <div class="card">
        <div class="card-label">가장 안 보는 페이지</div>
        <div class="card-value" id="stat-low-page" style="font-size:18px;margin-top:4px;">—</div>
        <div class="card-sub" id="stat-low-page-sec"></div>
      </div>
      <div class="card">
        <div class="card-label">문의 · 건의</div>
        <div class="card-value" id="stat-feedback-cnt">—</div>
      </div>
    </div>

    <!-- 최근 7일 방문자 -->
    <div class="section" style="margin-bottom:16px;">
      <div class="section-head">최근 7일 방문자</div>
      <div class="section-body">
        <div class="daily-chart" id="daily-chart"></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;" id="two-col">
      <!-- 페이지별 체류시간 -->
      <div class="section">
        <div class="section-head">페이지별 평균 체류시간</div>
        <div class="section-body" id="pages-bars"></div>
      </div>
      <!-- 클릭 Top 10 -->
      <div class="section">
        <div class="section-head">가장 많이 클릭한 영역 Top 10</div>
        <div class="section-body" id="clicks-bars"></div>
      </div>
    </div>

    <!-- 이탈 페이지 -->
    <div class="section">
      <div class="section-head">이탈 페이지</div>
      <div class="section-body" id="exits-bars"></div>
    </div>

  </div>

  <!-- Feedback Tab -->
  <div class="main" id="tab-feedback" style="display:none;">
    <div class="section">
      <div class="section-head">
        <span>문의 · 건의 목록</span>
        <span id="fb-count" style="font-size:11px;color:var(--text-muted);font-weight:400;"></span>
      </div>
      <div class="section-body" id="feedback-list"></div>
    </div>
  </div>
</div>

<script>
// ── Login ─────────────────────────────────────────────────────
function doLogin() {
  var pw = document.getElementById('pw-input').value;
  fetch('/api/admin/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pw})
  }).then(function(r) {
    if (r.ok) { showApp(); }
    else { document.getElementById('login-err').textContent = '비밀번호가 틀렸습니다.'; }
  }).catch(function() {
    document.getElementById('login-err').textContent = '서버 연결에 실패했습니다.';
  });
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAnalytics();
  loadFeedback();
}

// ── Tabs ──────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tab-analytics').style.display = name === 'analytics' ? '' : 'none';
  document.getElementById('tab-feedback').style.display = name === 'feedback' ? '' : 'none';
}

// ── Analytics ─────────────────────────────────────────────────
function loadAnalytics() {
  fetch('/api/admin/stats').then(function(r) { return r.json(); }).then(function(d) {
    document.getElementById('stat-sessions').textContent = d.sessions.toLocaleString();
    document.getElementById('badge-sessions').textContent = d.sessions.toLocaleString() + ' 세션';

    if (d.pages && d.pages.length) {
      document.getElementById('stat-top-page').textContent = d.pages[0].page;
      document.getElementById('stat-top-page-sec').textContent = '평균 ' + d.pages[0].avg_sec + '초';
      var low = d.pages[d.pages.length - 1];
      document.getElementById('stat-low-page').textContent = low.page;
      document.getElementById('stat-low-page-sec').textContent = '평균 ' + low.avg_sec + '초';
    }

    // 일별 방문자 차트
    renderDailyChart(d.daily || []);

    // 페이지 체류시간 바
    renderBars('pages-bars', d.pages || [], 'page', 'avg_sec', function(v) { return v + '초'; }, 'accent');

    // 클릭 바
    renderBars('clicks-bars', d.clicks || [], 'element', 'cnt', function(v) { return v + '회'; }, 'green');

    // 이탈 바
    renderBars('exits-bars', d.exits || [], 'page', 'cnt', function(v) { return v + '회'; }, 'yellow');
  }).catch(function(e) { console.error(e); });
}

function renderBars(containerId, items, labelKey, valKey, fmt, colorClass) {
  var el = document.getElementById(containerId);
  if (!items.length) { el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  var max = Math.max.apply(null, items.map(function(i) { return i[valKey]; }));
  el.innerHTML = items.map(function(item) {
    var pct = max > 0 ? Math.round(item[valKey] / max * 100) : 0;
    return '<div class="bar-row">' +
      '<div class="bar-label" title="' + item[labelKey] + '">' + item[labelKey] + '</div>' +
      '<div class="bar-track"><div class="bar-fill ' + colorClass + '" style="width:' + pct + '%"></div></div>' +
      '<div class="bar-val">' + fmt(item[valKey]) + '</div>' +
    '</div>';
  }).join('');
}

function renderDailyChart(daily) {
  var el = document.getElementById('daily-chart');
  if (!daily.length) { el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:16px;">데이터 없음</div>'; return; }
  var max = Math.max.apply(null, daily.map(function(d) { return d.visitors; }));
  el.innerHTML = daily.map(function(d) {
    var pct = max > 0 ? Math.round(d.visitors / max * 68) : 2;
    return '<div class="daily-col">' +
      '<div class="daily-bar" style="height:' + pct + 'px;" title="' + d.visitors + '명"></div>' +
      '<div class="daily-label">' + d.day + '</div>' +
    '</div>';
  }).join('');
}

// ── Feedback ──────────────────────────────────────────────────
function loadFeedback() {
  fetch('/api/admin/feedback').then(function(r) { return r.json(); }).then(function(d) {
    var items = d.items || [];
    document.getElementById('stat-feedback-cnt').textContent = items.length.toLocaleString();
    document.getElementById('badge-feedback').textContent = items.length + ' 문의';
    document.getElementById('fb-count').textContent = '총 ' + items.length + '건';
    var el = document.getElementById('feedback-list');
    if (!items.length) { el.innerHTML = '<div class="empty">접수된 문의가 없습니다.</div>'; return; }
    el.innerHTML = items.map(function(item) {
      var badge = item.type === 'suggestion'
        ? '<span class="fb-badge suggestion">건의</span>'
        : '<span class="fb-badge inquiry">문의</span>';
      var sender = (item.name || item.email)
        ? '<div class="fb-sender">' + [item.name, item.email].filter(Boolean).join(' · ') + '</div>'
        : '';
      return '<div class="fb-item">' +
        '<div class="fb-item-head">' + badge + '<span class="fb-meta">' + item.ts + '</span></div>' +
        '<div class="fb-message">' + escHtml(item.message) + '</div>' +
        sender +
      '</div>';
    }).join('');
  }).catch(function(e) { console.error(e); });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Responsive two-col ─────────────────────────────────────────
function checkLayout() {
  var tc = document.getElementById('two-col');
  if (!tc) return;
  tc.style.gridTemplateColumns = window.innerWidth < 700 ? '1fr' : '1fr 1fr';
}
window.addEventListener('resize', checkLayout);
checkLayout();
</script>
</body>
</html>
