name: E2E

# 채용공고: "E2E 테스트 케이스 설계 및 자동화 스크립트 작성(사용자 시나리오 기반)".
#
# 배포된 라이브 데모(Railway)를 대상으로 데모 세션 기반 사용자 시나리오를 검증한다.
# 로그인 계정·secret·DB 불필요. 수동 실행 + 배포 후 확인용 스케줄.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "테스트 대상 URL"
        default: "https://web-production-cdd14.up.railway.app"
        required: false
  schedule:
    - cron: "0 22 * * 1"   # 매주 화요일 07:00 KST

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://web-production-cdd14.up.railway.app' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install Playwright browser (chromium)
        run: python -m playwright install --with-deps chromium
      - name: Run E2E against ${{ env.E2E_BASE_URL }}
        run: pytest -m e2e -q --junitxml=e2e-report.xml
      - name: Publish test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: e2e-report.xml
