[pytest]
# Vantix QA 자동화 테스트 설정
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 마커 — `pytest -m "unit or api"` 처럼 계층별 실행에 사용
markers =
    unit: 순수 로직 단위 테스트 (외부 의존성 없음, 항상 실행)
    api: FastAPI TestClient 기반 API 계약/자동화 테스트
    e2e: Playwright 브라우저 E2E (실행 중인 서버 + 테스트 계정 필요)
    db: Postgres(DATABASE_URL) 연결이 있어야 실행되는 테스트

# 기본 실행 시 E2E는 제외 (CI unit/api 잡과 동일)
addopts = -ra --strict-markers -m "not e2e"

filterwarnings =
    ignore::DeprecationWarning
